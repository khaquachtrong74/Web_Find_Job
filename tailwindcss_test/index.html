<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ensure we have this to use cdn tailwindcss -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <!-- CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
  </head>
  <body class="background-nord pt-10 pl-20 pr-20">
    <header class="mt-2">
      <!-- bg-clip-text to make background on text  -->
      <h1
        class="tracking-tight text-left1 background-nord to-red-500 bg-clip-text text-5xl font-extrabold text-transparent ..."
      >
        Quach Trong Kha 👋
      </h1>
    </header>
    <main class="mt-2">
      <!-- home -->
      <section class="leading-8">
        <!-- https://github.com/DenverCoder1/readme-typing-svg for below -->
        <img
          src="https://readme-typing-svg.herokuapp.com?font=JetBrains+Mono+Regular&color=blue&size=25&center=true&vCenter=true&width=600&height=100&lines=📖+Open+University+of+Ho+Chi+Minh+City;Learning+World+:u"
        />
        <div class="flex">
          <div
            class="basic-2xs h-128 w-128 bg-cover bg-center bg-[url(./images/giphy.gif)] rounded-t-lg"
          ></div>
          <div class="size-14 grow-0"></div>
          <div class="mt-2 text-sm basic-sm">
            <img src="./images/nixos.jpg" alt="" width="30%" />
            <div class="text-center">
              <picture>
                <source
                  media="(prefers-color-scheme: dark)"
                  srcset="
                    https://raw.githubusercontent.com/khaquachtrong74/snk/output/github-contribution-grid-snake-dark.svg
                  "
                />
                <img
                  alt="Snake animation"
                  src="https://raw.githubusercontent.com/khaquachtrong74/snk/output/github-contribution-grid-snake.svg"
                  class="inline-block"
                />
              </picture>
            </div>
          </div>
          <div class="size-14 grow-0"></div>
          <div
            class="bg-red-400 basic-2xs h-128 w-128 bg-[url(./images/code.gif)] bg-cover bg-center rounded-t-lg"
          ></div>
        </div>
      </section>
    </main>
    <div class="flex justify-between">
      <button
        onclick="playAudio()"
        class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 pl-22 pr-21"
      >
        🎵 Chill time
      </button>
      <button
        onclick="pauseAudio()"
        class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 pl-19 pr-18"
      >
        🧑‍💻 Stop to cook
      </button>
    </div>
    <audio id="bgMusic" loop>
      <source
        src="audio/sam-gellaitry-assumptions-speed-up.mp3"
        type="audio/mpeg"
      />
    </audio>
    <footer class="mt-2 text-special">
      <p>&copy; 2025 Quach Trong Kha. All rights reserved.</p>
    </footer>
  </body>
  <script>
    function playAudio() {
      const audio = document.getElementById("bgMusic");
      audio
        .play()
        .then(() => {
          console.log("Start Ok~!");
        })
        .catch((err) => {
          console.warn("Error at playAudio", err);
        });
    }
    function pauseAudio() {
      const audio = document.getElementById("bgMusic");
      audio
        .pause()
        .then(() => {
          this.currentTime = 0;
          console.log("Pause Ok!");
        })
        .catch((err) => {
          console.warn("Error at pauseAudio", err);
        });
    }
  </script>
</html>
